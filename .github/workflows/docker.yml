name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build JAR with Maven
      run: mvn clean package

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Set version tag
      id: vars
      run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV

    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/java-app:latest .
        docker tag ${{ secrets.DOCKER_USERNAME }}/java-app:latest ${{ secrets.DOCKER_USERNAME }}/java-app:${{ env.VERSION }}

    - name: Push Docker images
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/java-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/java-app:${{ env.VERSION }}
